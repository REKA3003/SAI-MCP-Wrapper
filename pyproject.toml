[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basesmcp"
version = "0.1.0"
description = "Turn any Python function into an auto-registered MCP tool with a single @mcp decorator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["mcp", "model-context-protocol", "fastmcp", "llm", "tools", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.0,<4.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "build>=1.2", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/your-org/SAI-MCP-Wrapper"
Repository = "https://github.com/your-org/SAI-MCP-Wrapper"
Issues = "https://github.com/your-org/SAI-MCP-Wrapper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/basesmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
